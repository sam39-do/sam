<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="星原沙盒，一个可离线游玩的 2D 建造与探索小游戏。"
    />
    <title>星原沙盒</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="sandbox-shell">
      <section class="sandbox-stage" aria-label="星原沙盒">
        <canvas
          id="worldCanvas"
          width="1280"
          height="720"
          aria-label="星原沙盒世界画布"
        ></canvas>

        <header class="top-hud" aria-live="polite">
          <div class="hud-brand">
            <span class="brand-mark" aria-hidden="true"></span>
            <span>星原沙盒</span>
          </div>
          <div class="hud-stat">
            <span>天数</span>
            <strong id="dayCount">1</strong>
          </div>
          <div class="hud-stat">
            <span>时段</span>
            <strong id="timeName">清晨</strong>
          </div>
          <div class="hud-stat">
            <span>能量</span>
            <strong id="energyValue">100</strong>
          </div>
          <div class="hud-stat">
            <span>坐标</span>
            <strong id="positionValue">0,0</strong>
          </div>
        </header>

        <aside class="inventory-panel" aria-label="资源背包">
          <div class="panel-title">背包</div>
          <div class="inventory-grid" id="inventoryGrid"></div>
        </aside>

        <aside class="craft-panel" aria-label="合成">
          <div class="panel-title">合成</div>
          <button class="craft-button" data-craft="plank" type="button">木板</button>
          <button class="craft-button" data-craft="lamp" type="button">灯</button>
        </aside>

        <nav class="toolbelt" id="toolbelt" aria-label="工具栏"></nav>

        <div class="action-panel">
          <button id="modeButton" type="button">生存</button>
          <button id="saveButton" type="button">保存</button>
          <button id="resetButton" type="button">重置</button>
        </div>

        <div class="message-feed" id="messageFeed" aria-live="polite"></div>

        <div class="intro-panel" id="introPanel">
          <h1>星原沙盒</h1>
          <p>挖开山体，搭一座会发光的小基地。</p>
          <button id="playButton" type="button">进入世界</button>
        </div>

        <div class="touch-controls" aria-label="触屏控制">
          <button class="touch-button" data-input="left" type="button" aria-label="向左">‹</button>
          <button class="touch-button" data-input="jump" type="button" aria-label="跳跃">⌃</button>
          <button class="touch-button" data-input="right" type="button" aria-label="向右">›</button>
        </div>
      </section>
    </main>

    <script src="sandbox.js"></script>
  </body>
</html>
