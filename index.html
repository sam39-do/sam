<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="九熊山，古风侠义小熊的 3D 生存沙盒游戏。"
    />
    <title>九熊山</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="game-stage" aria-label="九熊山">
        <canvas id="gameCanvas" aria-label="3D 生存沙盒画面"></canvas>

        <header class="top-hud" aria-live="polite">
          <div class="hud-brand">
            <span class="brand-mark" aria-hidden="true"></span>
            <span>九熊山</span>
          </div>
          <div class="hud-pill"><span>生命</span><strong id="lifeValue">100</strong></div>
          <div class="hud-pill"><span>护盾</span><strong id="shieldValue">0</strong></div>
          <div class="hud-pill"><span>星星</span><strong id="starValue">0</strong></div>
          <div class="hud-pill"><span>武器</span><strong id="weaponValue">球拍</strong></div>
          <div class="hud-pill"><span>视角</span><strong id="cameraValue">第三</strong></div>
          <div class="hud-pill"><span>Boss</span><strong id="bossValue">未激活</strong></div>
        </header>

        <aside class="inventory-panel" aria-label="资源背包">
          <div class="panel-title">生存背包</div>
          <div class="inventory-grid" id="inventoryGrid"></div>
        </aside>

        <aside class="minimap-panel" aria-label="小地图">
          <canvas id="minimapCanvas" width="168" height="168"></canvas>
        </aside>

        <aside class="shop-panel is-hidden" id="shopPanel" aria-label="道具商店">
          <div class="shop-head">
            <div>
              <div class="panel-title">道具商店</div>
              <strong>武器、皮肤、技能</strong>
            </div>
            <button id="closeShopButton" type="button" aria-label="关闭商店">×</button>
          </div>
          <div class="shop-balance">星星 <strong id="shopStars">0</strong></div>
          <div class="shop-section">皮肤</div>
          <div class="shop-list" id="skinShop"></div>
          <div class="shop-section">球拍武器</div>
          <div class="shop-list" id="racketShop"></div>
          <div class="shop-section">装备和技能</div>
          <div class="shop-list" id="abilityShop"></div>
          <div class="shop-section">幸运转盘</div>
          <button class="shop-wide-button" id="spinButton" type="button">7777 星星抽奖</button>
        </aside>

        <nav class="toolbelt" id="toolbelt" aria-label="工具栏"></nav>

        <div class="action-panel">
          <button id="shopButton" type="button">商店</button>
          <button id="modeButton" type="button">生存</button>
          <button id="saveButton" type="button">保存</button>
          <button id="resetButton" type="button">重开</button>
        </div>

        <div class="boss-hud is-hidden" id="bossHud">
          <div class="boss-hud-row">
            <strong id="bossName">Boss</strong>
            <span id="bossHpText">0/0</span>
          </div>
          <div class="boss-bar"><span id="bossHpBar"></span></div>
        </div>

        <div class="message-feed" id="messageFeed" aria-live="polite"></div>

        <div class="intro-panel" id="introPanel">
          <h1>九熊山</h1>
          <p>调查披风随风摆动，巨人群落和后颈刀刃战已进入九熊山。</p>
          <p class="load-error" id="loadError">游戏文件没有加载成功。请刷新页面，或用主页链接打开。</p>
          <button id="playButton" type="button">入山</button>
        </div>

        <div class="control-help">
          WASD 移动 · 鼠标前推抬头/后拖低头 · J 立体机动 · 左键钩爪 · 右键后颈刀刃/放置 · L 传送火山 · C 创造/生存 · Y 视角 · Q 小猪/手枪
        </div>
      </section>
    </main>

    <script>
      window.addEventListener("error", () => document.body.classList.add("has-load-error"));
      window.addEventListener("unhandledrejection", () => document.body.classList.add("has-load-error"));
    </script>
    <script type="module" src="sandbox.js"></script>
  </body>
</html>
